name: Build & Release APK

on:
  push:
  workflow_dispatch:

# Izin menerbitkan GitHub Release (dibaca fitur update di dalam aplikasi)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Ekstrak zip (jika proyek diunggah sebagai file zip)
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -q -o "$z" -d proyek; done

      - name: Pasang Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang NDK 28 dan CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Siapkan proyek dan baca versi
        id: prep
        run: |
          GRADLEW=$(find . -maxdepth 4 -name gradlew -not -path "./.git/*" | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew tidak ditemukan. Pastikan file zip proyek atau isi proyek sudah diunggah ke repositori."
            exit 1
          fi
          SRC="$(dirname "$GRADLEW")"
          DEST="$RUNNER_TEMP/proj"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r "$SRC/." "$DEST/"

          # File di akar repositori menimpa isi zip, sehingga versi & catatan rilis
          # bisa diedit langsung di GitHub tanpa membuat zip ulang.
          if [ -f version.properties ]; then cp version.properties "$DEST/version.properties"; fi
          if [ -f release_notes.txt ]; then cp release_notes.txt "$DEST/release_notes.txt"; fi

          VERSION=$(grep -E '^versionName=' "$DEST/version.properties" | head -1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "versionName tidak ditemukan di version.properties"
            exit 1
          fi
          if [ ! -f "$DEST/release_notes.txt" ]; then
            echo "Pembaruan versi $VERSION" > "$DEST/release_notes.txt"
          fi
          echo "Versi yang dibangun: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unduh Dear ImGui v1.90.9
        run: git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git "$RUNNER_TEMP/proj/app/src/main/cpp/imgui"

      - name: Build APK release
        working-directory: ${{ runner.temp }}/proj
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PupdateRepo=${{ github.repository }} --stacktrace

      - name: Siapkan file APK
        run: cp "$RUNNER_TEMP/proj/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/proj/FloatingDebug-${{ steps.prep.outputs.version }}.apk"

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingDebug-${{ steps.prep.outputs.version }}
          path: ${{ runner.temp }}/proj/FloatingDebug-${{ steps.prep.outputs.version }}.apk

      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: FloatingDebug v${{ steps.prep.outputs.version }}
          body_path: ${{ runner.temp }}/proj/release_notes.txt
          files: ${{ runner.temp }}/proj/FloatingDebug-${{ steps.prep.outputs.version }}.apk
          make_latest: true
          
